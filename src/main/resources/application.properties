spring.application.name=Spring-boot-Reactive-programming
server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Resilience4j config for the phoneService circuit breaker / retry
resilience4j.circuitbreaker.instances.phoneService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.phoneService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.phoneService.waitDurationInOpenState=10s

resilience4j.retry.instances.phoneService.maxAttempts=3
resilience4j.retry.instances.phoneService.waitDuration=500ms